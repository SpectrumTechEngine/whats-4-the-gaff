<style>
  :root {
    --bg: #5a3f2c;
    --paper: #f4ead2;
    --cream: #faf6ee;
    --ink: #1c1612;
    --muted: #6b5a4c;
    --accent: #b4452a;
    --accent-fg: #faf6ee;
    --rule: #d3c19c;
    --margin: #e59b8c;
    --tape: #edd59a;
    --row: 2.3rem;          /* gap between the pad's lines */
    --hand-size: 1.55rem;   /* size of the handwriting on the pad */

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--cream); font-family: var(--ui); -webkit-tap-highlight-color: transparent; }

  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }
  .cork {

  .wrap {

  }
  .wrap.fixed { height: 100dvh; min-height: 0; padding-bottom: calc(.75rem + env(safe-area-inset-bottom, 0px)); }

  .brand p { margin: .25rem 0 0; font-size: .875rem; color: rgb(250 246 238 / .75); }
  .logo { width: 3rem; height: 3rem; flex-shrink: 0; }

  .tape.r { right: 1.4rem; transform: rotate(7deg); }
  .pad { padding: 1.75rem 1.25rem 1.5rem; }
  .hand { font-family: var(--hand); }

  .top { display: flex; align-items: center; gap: .35rem; margin-bottom: .6rem; }

  .trip .x { width: 2rem; height: 2rem; border-radius: 99px; color: var(--muted); font-size: 1rem; flex-shrink: 0; }
  .trip-go {
    display: flex; align-items: center; justify-content: center; gap: .45rem; width: 100%; min-height: 2.75rem;
    border-radius: 999px; font-weight: 800; font-size: .95rem; color: var(--cream);
    background: rgb(250 246 238 / .1); box-shadow: inset 0 0 0 1.5px rgb(250 246 238 / .4);
  }

  /* The pad */
  .sheet { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 1.6rem; overflow: hidden; }
  .list {
    flex: 1; min-height: 0; overflow-y: auto; padding: 0 0 8.5rem;
    background-image:
      linear-gradient(var(--margin), var(--margin)),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--row) - 1px), var(--rule) calc(var(--row) - 1px), var(--rule) var(--row));
    background-size: 1px 100%, 100% var(--row);
    background-position: 2.4rem 0, 0 0;
    background-repeat: no-repeat, repeat;
    background-attachment: local, local;
  }
  .empty { margin: 0; padding: 0 1rem 0 3rem; font-family: var(--hand); font-size: var(--hand-size); line-height: var(--row); color: var(--muted); }
  .empty span, .heading span { position: relative; top: var(--drop); }
  .heading { height: var(--row); padding: 0 1rem 0 3rem; font-family: var(--hand); font-size: 1.2rem; line-height: var(--row); font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item { display: flex; align-items: flex-start; min-height: var(--row); padding-left: 3rem; padding-right: .3rem; }
  .item.sel { background: color-mix(in oklab, var(--tape) 70%, transparent); }
  .item .line {
    flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: .55rem; text-align: left;
    font-family: var(--hand); font-size: var(--hand-size); line-height: var(--row); font-weight: 500; color: var(--ink);

  .item .txt { position: relative; top: var(--drop); max-width: 74%; overflow-wrap: anywhere; }

  @media (hover: hover) { .del:hover { color: var(--accent); } }
  /* Scratched-out items: a pen stroke through every line of the writing, in the buyer's colour */
  .bought .words {
    background-image: linear-gradient(to bottom, transparent 46%, var(--pc) 46%, var(--pc) 56%, transparent 56%);

    content: ""; position: absolute; top: -.4rem; left: 50%; width: 2.4rem; height: .72rem; margin-left: -1.2rem;

  .overlay { position: fixed; inset: 0; background: rgb(28 22 18 / .55); z-index: 40; }

  .pens { display: flex; flex-wrap: wrap; gap: .6rem; }

  .code { text-align: center; font-family: var(--hand); font-size: 2.8rem; letter-spacing: .18em; margin: .75rem 0 1rem; }

  .opt:hover, .opt.on { background: color-mix(in oklab, var(--tape) 60%, transparent); }
  .opt.on::after { content: "  ✓"; font-family: var(--ui); font-size: 1rem; font-weight: 800; }
  .check { display: flex; align-items: center; gap: .6rem; margin: 1rem 0; font-size: .9rem; font-weight: 700; color: var(--ink); }
  .check input { width: 1.35rem; height: 1.35rem; accent-color: #1f8f4e; flex-shrink: 0; }
  .tiny { font-size: .75rem; color: var(--muted); }
  .textlink { font-size: .78rem; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .shop-row { display: flex; align-items: center; gap: .5rem; margin: .3rem 0; }
  .shop-row .hand { flex: 1; font-size: 1.25rem; }
  .divider { margin-top: 1.4rem; border-top: 1px solid rgb(28 22 18 / .1); padding-top: 1rem; }
  .center { text-align: center; }

  /* Little messages at the top */
  #toasts {
    position: fixed; left: 50%; top: calc(.6rem + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    z-index: 100; width: min(calc(100% - 1.5rem), 26rem); display: flex; flex-direction: column; gap: .45rem; pointer-events: none;
  }
  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: .75rem; padding: .7rem .9rem; border-radius: 12px;
    background: var(--ink); color: var(--cream); font-weight: 700; font-size: .9rem; line-height: 1.3;
    box-shadow: 0 12px 28px -12px rgb(0 0 0 / .6); animation: tin .22s ease-out;
  }
  .toast .m { flex: 1; }
  .toast button { color: var(--tape); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
  .loading { margin: auto; text-align: center; font-family: var(--hand); font-size: 1.8rem; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

/* ---------------- Live backend: Firebase ---------------- */
function makeFirebaseBackend() {
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  const fs = firebase.firestore();
  const FV = firebase.firestore.FieldValue;
  const gdoc = (c) => fs.doc("gaffs/" + c);
  return {
    mode: "live",
    async start() {
      // Keeps a copy on the phone so the list still works in shops with bad signal
      try { await withTimeout(fs.enablePersistence({ synchronizeTabs: true }), 2500); } catch (e) {}
      const existing = await new Promise(res => { const un = auth.onAuthStateChanged(u => { un(); res(u); }); });
      if (existing) return existing.uid;
      const cred = await auth.signInAnonymously();
      return cred.user.uid;
    },
    watchProfile: (uid, cb, err) => fs.doc("users/" + uid).onSnapshot(s => cb(s.exists ? s.data() : null), err),
    saveProfile: (uid, d) => fs.doc("users/" + uid).set(d, { merge: true }),
    addGaffToProfile: (uid, c) => fs.doc("users/" + uid).set({ gaffs: FV.arrayUnion(c) }, { merge: true }),
    removeGaffFromProfile: (uid, c) => fs.doc("users/" + uid).set({ gaffs: FV.arrayRemove(c) }, { merge: true }),
    async getGaff(c) { const s = await gdoc(c).get(); return s.exists ? s.data() : null; },
    async createGaff(c, gaff, uid, member) {
      const b = fs.batch();
      b.set(gdoc(c), gaff);
      b.set(fs.doc(`gaffs/${c}/members/${uid}`), member);
      await b.commit();
    },
    setMember: (c, uid, m) => fs.doc(`gaffs/${c}/members/${uid}`).set(m, { merge: true }),
    removeMember: (c, uid) => fs.doc(`gaffs/${c}/members/${uid}`).delete(),
    updateGaff: (c, patch) => gdoc(c).update(patch),
    setTrip: (c, uid, trip) => gdoc(c).update({ ["trips." + uid]: trip ? trip : FV.delete() }),
    watchGaff: (c, cb, err) => gdoc(c).onSnapshot(s => cb(s.exists ? s.data() : null), err),
    watchMembers: (c, cb, err) => fs.collection(`gaffs/${c}/members`).onSnapshot(q => { const m = {}; q.forEach(d => { m[d.id] = d.data(); }); cb(m); }, err),
    watchItems: (c, cb, err) => fs.collection(`gaffs/${c}/items`).onSnapshot(q => cb(q.docs.map(d => ({ id: d.id, ...d.data() }))), err),
    setItem: (c, id, d) => fs.doc(`gaffs/${c}/items/${id}`).set(d),
    updateItem: (c, id, p) => fs.doc(`gaffs/${c}/items/${id}`).update(p),
    deleteItem: (c, id) => fs.doc(`gaffs/${c}/items/${id}`).delete(),
  };
}

/* ---------------- Preview backend (not connected, stays on this phone) ---------------- */
function makeLocalBackend() {
  const KEY = "w4tg-demo";
  const ch = "BroadcastChannel" in window ? new BroadcastChannel("w4tg-demo") : null;
  const blank = () => ({ users: {}, gaffs: {} });
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || blank(); } catch (e) { return blank(); } };
  let data = load();
  const listeners = new Set();
  const clone = (o) => o == null ? o : JSON.parse(JSON.stringify(o));
  const emit = () => queueMicrotask(() => listeners.forEach(f => f()));
  const commit = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} if (ch) ch.postMessage(1); emit(); };
  if (ch) ch.onmessage = () => { data = load(); emit(); };
  window.addEventListener("storage", e => { if (e.key === KEY) { data = load(); emit(); } });
  const watch = (fn, cb) => { const f = () => cb(fn()); listeners.add(f); queueMicrotask(f); return () => listeners.delete(f); };
  const G = (c) => data.gaffs[c];
  return {
    mode: "demo",
    async start() {
      const as = new URLSearchParams(location.search).get("as");
      if (as) return "demo-" + as;
      let id = null;
      try { id = localStorage.getItem("w4tg-demo-uid"); } catch (e) {}
      if (!id) { id = "demo-" + newId().slice(0, 10); try { localStorage.setItem("w4tg-demo-uid", id); } catch (e) {} }
      return id;
    },
    watchProfile: (uid, cb) => watch(() => clone(data.users[uid] || null), cb),
    async saveProfile(uid, d) { data.users[uid] = { ...(data.users[uid] || {}), ...clone(d) }; commit(); },
    async addGaffToProfile(uid, c) { const u = data.users[uid] || (data.users[uid] = {}); u.gaffs = [...new Set([...(u.gaffs || []), c])]; commit(); },
    async removeGaffFromProfile(uid, c) { const u = data.users[uid]; if (u) u.gaffs = (u.gaffs || []).filter(x => x !== c); commit(); },
    async getGaff(c) { return clone(G(c)?.doc || null); },
    async createGaff(c, gaff, uid, member) { data.gaffs[c] = { doc: clone(gaff), members: { [uid]: clone(member) }, items: {} }; commit(); },
    async setMember(c, uid, m) { const g = G(c); if (!g) throw new Error("No gaff"); g.members[uid] = { ...(g.members[uid] || {}), ...clone(m) }; commit(); },
    async removeMember(c, uid) { if (G(c)) delete G(c).members[uid]; commit(); },
    async updateGaff(c, patch) { Object.assign(G(c).doc, clone(patch)); commit(); },
    async setTrip(c, uid, trip) { const d = G(c).doc; d.trips = d.trips || {}; if (trip) d.trips[uid] = clone(trip); else delete d.trips[uid]; commit(); },
    watchGaff: (c, cb) => watch(() => clone(G(c)?.doc || null), cb),
    watchMembers: (c, cb) => watch(() => clone(G(c)?.members || {}), cb),
    watchItems: (c, cb) => watch(() => Object.entries(G(c)?.items || {}).map(([id, v]) => ({ id, ...clone(v) })), cb),
    async setItem(c, id, d) { G(c).items[id] = clone(d); commit(); },
    async updateItem(c, id, p) { const it = G(c)?.items[id]; if (it) { Object.assign(it, clone(p)); commit(); } },
    async deleteItem(c, id) { if (G(c)) delete G(c).items[id]; commit(); },
  };
}

// Makes the "Last orders" picture with a chalkboard strip saying who's off where
function makeOrdersCard(name, shop) {
  const W = 1200, PH = 630, SH = 190;
  const c = document.createElement("canvas");
  c.width = W; c.height = PH + SH;
  const x = c.getContext("2d");
  try { x.drawImage(IMG.orders, 0, 0, W, PH); } catch (e) { x.fillStyle = "#5a3f2c"; x.fillRect(0, 0, W, PH); }
  // wooden edge and chalkboard
  x.fillStyle = "#5b3a22"; x.fillRect(0, PH, W, SH);
  const g = x.createLinearGradient(0, PH + 12, 0, PH + SH);
  g.addColorStop(0, "#26332c"); g.addColorStop(1, "#1a231e");
  x.fillStyle = g; x.fillRect(14, PH + 12, W - 28, SH - 26);
  // a soft chalk haze, like a board that's been wiped
  const haze = x.createRadialGradient(W * .35, PH + SH * .45, 20, W * .35, PH + SH * .45, W * .6);
  haze.addColorStop(0, "rgba(255,255,255,.07)"); haze.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = haze; x.fillRect(14, PH + 12, W - 28, SH - 26);
  const logoW = 250, logoH = IMG.logo.naturalWidth ? logoW * IMG.logo.naturalHeight / IMG.logo.naturalWidth : 32;
  const textW = W - 90 - logoW - 40;
  // headline: "Ste's off to Aldi!" with the name in chalk yellow
  const who = name + "'s", rest = " off to " + shop + "!";
  let size = 88;
  const fit = () => { x.font = `700 ${size}px Caveat, cursive`; return x.measureText(who + rest).width; };
  while (fit() > textW && size > 44) size -= 4;
  x.textBaseline = "alphabetic";
  x.shadowColor = "rgba(0,0,0,.35)"; x.shadowBlur = 3;
  x.fillStyle = "#f6d67a"; x.fillText(who, 50, PH + 100);
  x.fillStyle = "#f3efe4"; x.fillText(rest, 50 + x.measureText(who).width, PH + 100);
  x.shadowBlur = 0;
  x.font = "700 34px Nunito, sans-serif"; x.fillStyle = "rgba(243,239,228,.85)";
  x.fillText("Get your orders in on What's 4 the Gaff", 52, PH + 150);
  try { if (IMG.logo.naturalWidth) x.drawImage(IMG.logo, W - logoW - 40, PH + SH - logoH - 34, logoW, logoH); } catch (e) {}
  return c.toDataURL("image/jpeg", .86);
}
function dataUrlToFile(url, name) {
  const [head, b64] = url.split(",");
  const type = head.match(/:(.*?);/)[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name, { type });
}

function shareOrders(name, shop, text) {
  let url = null, file = null;
  try { url = makeOrdersCard(name, shop); file = dataUrlToFile(url, "last-orders.jpg"); } catch (e) { console.warn(e); }
  const data = file ? { files: [file], text } : null;
  let canFiles = false;
  try { canFiles = !!(data && navigator.canShare && navigator.canShare(data)); } catch (e) {}
  if (canFiles) {
    navigator.share(data).catch(err => {
      if (err && err.name === "AbortError") return;           // they closed the share menu
      if (!S.live && url) { showCard(url); return; }           // Claude's preview blocks sharing
      openWhatsApp(text);                                       // last resort: message without the picture
    });
    return;
  }
  if (!S.live && url) { showCard(url); return; }
  openWhatsApp(text);
}

// Opens WhatsApp with a message ready to send
function openWhatsApp(text) {
  const url = "https://wa.me/?text=" + encodeURIComponent(text);

  try { w = window.open(url, "_blank"); } catch (e) {}
  if (w) return;
  if (S.live) { location.href = url; return; }
  toast("WhatsApp can't open from this preview. It will work once the app is on GitHub.", null, 6000);
}
// Links point at small helper pages so WhatsApp shows the right picture:
// join.html shows "Come Join My Gaff", lastorders.html shows "Last Orders".

function appFolder() { return location.origin + location.pathname.replace(/[^/]*$/, ""); }

/* ---------------- Subscriptions ---------------- */
function syncSubs() {
  const want = new Set(me()?.gaffs || []);
  for (const code of Object.keys(S.gaffs)) if (!want.has(code)) dropGaff(code);
  for (const code of want) if (!S.gaffs[code]) watchGaffAll(code);
}
function dropGaff(code) {
  const g = S.gaffs[code];
  if (g) g.unsubs.forEach(u => { try { u(); } catch (e) {} });
  delete S.gaffs[code];
}
function watchGaffAll(code) {
  const g = S.gaffs[code] = { doc: undefined, members: {}, items: [], unsubs: [] };
  const err = (e) => console.warn("watch", code, e);
  g.unsubs.push(B().watchGaff(code, d => { noticeTrips(code, g.doc, d); g.doc = d; tidyMyTrip(code); render(); }, err));
  g.unsubs.push(B().watchMembers(code, m => { g.members = m; fixupAfterJoin(code); render(); }, err));
  g.unsubs.push(B().watchItems(code, items => {
    const cut = Date.now() - DAY;
    g.items = items.filter(i => {
      if (i.boughtAt && i.boughtAt < cut) {
        if (!S.expiring.has(i.id)) { S.expiring.add(i.id); B().deleteItem(code, i.id).catch(() => {}); }
        return false;
      }
      return true;
    }).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    render();
  }, err));
}

// Let people know when someone else heads to / arrives at / finishes a shop
function noticeTrips(code, oldDoc, newDoc) {
  if (!newDoc || oldDoc === undefined) return;
  const before = oldDoc?.trips || {};
  const after = newDoc.trips || {};
  for (const [uid, t] of Object.entries(after)) {
    if (uid === S.uid || !t || t.at < S.loadedAt) continue;
    const prev = before[uid];
    if (prev && prev.stage === t.stage && prev.at === t.at) continue;
    const where = (me()?.gaffs || []).length > 1 ? ` (${newDoc.name})` : "";
    const words = t.stage === "heading" ? `${t.name} is heading to ${t.shopName}${where}. Add what you need!`
      : t.stage === "arrived" ? `${t.name} has arrived at ${t.shopName}${where}.`
      : `${t.name} has finished the shop at ${t.shopName}${where}.`;
    toast(words, t.stage === "heading" && S.view.code !== code ? { label: "Open list", run: () => openGaff(code) } : null, 7000);
    try { if (t.stage === "heading" && navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) {}
  }
}
// Remove my own finished trip once it's old
function tidyMyTrip(code) {
  const t = G(code)?.doc?.trips?.[S.uid];
  if (t && t.stage === "finished" && Date.now() - t.at > FINISHED_SHOWS_FOR) write(B().setTrip(code, S.uid, null));
}
// After joining, make sure my name and pen colour don't clash with someone already there
function fixupAfterJoin(code) {
  if (!S.fixups.has(code)) return;
  const g = G(code); const mine = g.members[S.uid];
  if (!mine) return;
  S.fixups.delete(code);
  const others = Object.entries(g.members).filter(([id]) => id !== S.uid).map(([, m]) => m);
  const patch = {};
  if (others.some(o => (o.display || "").toLowerCase() === (mine.display || "").toLowerCase())) patch.display = uniqueName(others, mine.display);
  const used = others.map(o => o.pen);
  if (used.includes(mine.pen)) {
    const free = PENS.filter(p => !used.includes(p.id));
    if (free.length) patch.pen = free[Math.floor(Math.random() * free.length)].id;
  }
  if (Object.keys(patch).length) write(B().setMember(code, S.uid, patch));
}
function uniqueName(others, wanted) {
  let name = wanted, n = 2;
  const taken = (nm) => others.some(m => (m.display || "").toLowerCase() === nm.toLowerCase());
  while (taken(name)) { name = wanted + " " + n; n++; }
  return name;
}

/* ---------------- Routing ---------------- */
function route() {
  const v = S.view;
  if (v.page === "error") return;
  if (S.profile === undefined) { v.page = "loading"; return; }
  if (!S.profile || !S.profile.name) { if (v.page !== "welcome") S.view = { page: "welcome", pen: "navy" }; return; }
  if (S.pendingJoin) {
    const code = S.pendingJoin;
    if ((S.profile.gaffs || []).includes(code)) { S.pendingJoin = null; openGaff(code, true); return; }
    if (v.page !== "joinConfirm") {
      S.view = { page: "joinConfirm", code };
      S.joinPreview = undefined;
      B().getGaff(code).then(d => { S.joinPreview = d; render(); }).catch(() => { S.joinPreview = null; render(); });
    }
    return;
  }
  if (v.page === "gaff" && !(S.profile.gaffs || []).includes(v.code)) { S.view = { page: "home" }; return; }
  if (["loading", "welcome", "joinConfirm"].includes(v.page)) S.view = { page: "home" };
}
function openGaff(code, silent) {
  S.view = { page: "gaff", code, selected: null, addStore: null, modal: null };
  if (!silent) render();
}

/* ---------------- Rendering ----------------
   Each screen is split into regions. When live data changes, only the regions whose
   content changed are redrawn, so what you're typing never gets wiped. */
let queued = false, lastKey = null, lastRegions = {};
function render() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; draw(); });
}
function draw() {
  route();
  const root = $("#app");
  const scr = screen();
  root.classList.toggle("fixed", !!scr.fixed);
  const key = scr.key;
  if (key !== lastKey) {
    root.innerHTML = scr.shell || scr.order.map(r => `<div data-r="${r}"></div>`).join("");
    lastRegions = {};
    lastKey = key;
  }
  for (const r of scr.order) {
    const html = scr.regions[r] || "";
    if (lastRegions[r] === html) continue;
    const el = root.querySelector(`[data-r="${r}"]`);
    if (!el) continue;
    // Keep what the person had typed, where they were scrolled, and which box was focused
    const keep = {};
    el.querySelectorAll("input[id], textarea[id]").forEach(i => { keep[i.id] = i.type === "checkbox" ? { c: i.checked } : { v: i.value }; });
    const act = document.activeElement;
    const actId = act && el.contains(act) ? act.id : null;
    let ss = null, se = null;
    try { if (actId) { ss = act.selectionStart; se = act.selectionEnd; } } catch (e) {}
    const scrolls = [...el.querySelectorAll("[data-keep-scroll]")].map(s => [s.dataset.keepScroll, s.scrollTop]);
    el.innerHTML = html;
    lastRegions[r] = html;
    el.querySelectorAll("input[id], textarea[id]").forEach(i => {
      const k = keep[i.id];
      if (!k || i.hasAttribute("data-fresh")) return;
      if ("c" in k) i.checked = k.c; else i.value = k.v;
    });
    for (const [name, top] of scrolls) { const s = el.querySelector(`[data-keep-scroll="${name}"]`); if (s) s.scrollTop = top; }
    if (actId) { const n = document.getElementById(actId); if (n) { n.focus({ preventScroll: true }); try { if (ss != null) n.setSelectionRange(ss, se); } catch (e) {} } }
  }
}
function screen() {
  const p = S.view.page;
  if (p === "loading") return one("loading", `<p class="loading">Opening the list…</p>`);
  if (p === "error") return one("error", errorHTML());
  if (p === "welcome") return welcomeScreen();
  if (p === "joinConfirm") return one("join-" + S.view.code, joinConfirmHTML());
  if (p === "gaff" && G(S.view.code)) return gaffScreen();
  return homeScreen();
}
const one = (key, html) => ({ key, order: ["main"], regions: { main: html } });

  const unassigned = g.items.filter(i => !i.storeId || !stores.some(s => s.id === i.storeId));
  const groups = stores.map(s => ({ s, items: g.items.filter(i => i.storeId === s.id) })).filter(x => x.items.length);
  const listHTML = g.items.length === 0
    ? `<p class="empty"><span>Nothing on the list. Write something below.</span></p>`
    : `${groups.length && unassigned.length ? `<div class="heading"><span>The list</span></div>` : ""}${rows(unassigned)}
       ${groups.map(gr => `<div class="heading"><span>${esc(gr.s.name)}</span></div>${rows(gr.items)}`).join("")}`;

  // Note and composer
  const noteVal = sel ? (sel.note || "") : (v.addNote || "");
  const notePh = sel ? "No note on this one. Tap to add" : "A wee note for the next item…";
  const storeName = sel ? stores.find(s => s.id === sel.storeId)?.name : stores.find(s => s.id === v.addStore)?.name;
  const note = `<aside class="inspector">
      <label for="note-${sel ? sel.id : "new"}">${sel ? "Note on this" : "Note"}</label>
      <textarea id="note-${sel ? sel.id : "new"}" data-i="note" maxlength="280" placeholder="${esc(notePh)}">${esc(noteVal)}</textarea>
    </aside>`;
  const storeLine = `<p class="store-line">${storeName
      ? `<span class="sl">${sel ? "“" + esc(sel.text) + "” is" : "Next item is"} for ${esc(storeName)}</span> <button type="button" data-a="clear-store">clear</button>`
      : sel ? `<span class="sl">Tap 🏪 to pick a shop for “${esc(sel.text)}”</span>` : "&nbsp;"}</p>`;
  const composer = `<form data-f="add">
      <input id="draft" maxlength="80" placeholder="milk, bread, tea…" aria-label="Add to the list" autocomplete="off" enterkeyhint="done" />
      <button type="button" class="round ghost" data-a="m" data-m="shop" aria-label="Pick a shop" style="font-size:1.05rem">🏪</button>
      <button type="submit" class="round add" aria-label="Add item">+</button>
    </form>`;

  // Pop-ups
  let m = "";
  if (v.modal === "invite") {
    m = modal("Invite the house", `<p class="muted">Send the link to anyone who lives here. Tapping it opens the app with the code already filled in.</p>
      <p class="code">${esc(code.split("").join(" "))}</p>
      <div class="stack">
        <button class="btn wa" data-a="invite-wa">Send on WhatsApp</button>
        ${navigator.share ? `<button class="btn primary" data-a="invite-share">Share invite</button>` : ""}
        <button class="btn ghost" data-a="invite-copy">${v.copied ? "Link copied" : "Copy link"}</button>
        <button class="btn ghost" data-a="close" style="background:transparent;box-shadow:none">Done</button>
      </div>`);
  } else if (v.modal === "shop") {
    m = modal("Which shop?", `${[{ id: "", name: "Main list (any shop)" }, ...stores].map(s =>
      `<button type="button" class="opt ${((sel ? sel.storeId : v.addStore) || "") === s.id ? "on" : ""}" data-a="pick-store" data-sid="${s.id}">${esc(s.name)}</button>`).join("")}
      <form data-f="new-shop" style="margin-top:.75rem;display:flex;gap:.4rem">
        <input class="inp" id="ns-name" name="n" placeholder="New shop…" maxlength="32" />
        <button class="btn primary" type="submit" style="width:auto">Add</button>
      </form>`);
  } else if (v.modal === "switch") {
    m = modal("Your gaffs", (me().gaffs || []).map(c => G(c)?.doc ? `<button type="button" class="opt ${c === code ? "on" : ""}" data-a="open" data-code="${c}">${esc(G(c).doc.name)}</button>` : "").join("")
      + `<p class="tiny" style="margin-top:.75rem">Create or join more from the home screen.</p>`);
  } else if (v.modal === "trip") {
    const chosen = v.tripShop;
    m = modal("Where are you off to?", `<p class="muted">Everyone in ${esc(d.name)} will see you're heading out, so they can add what they need.</p>
      <div style="margin:.6rem 0">${stores.map(s => `<button type="button" class="opt ${chosen === s.id ? "on" : ""}" data-a="trip-shop" data-sid="${s.id}">${esc(s.name)}</button>`).join("")}</div>
      <label class="check"><input type="checkbox" id="wa-too" ${prefs.get("waToo", false) ? "checked" : ""} /> Also send Last Orders to WhatsApp</label>
      <p class="tiny" style="margin:-.5rem 0 1rem 1.95rem">Your phone's share menu opens. Pick WhatsApp, then the house chat.</p>
      <button class="btn primary" data-a="trip-start" ${chosen ? "" : "disabled"}>${chosen ? "Let the house know" : "Pick a shop first"}</button>`);
  } else if (v.modal === "gear") {
    m = modal("Gaff settings", `
      <p class="muted">Your name and pen in <strong>${esc(d.name)}</strong>. Everyone here can add, scratch off and invite.</p>
      <form data-f="me">
        <label class="field"><span>Your name in this gaff</span>
          <input class="inp" id="g-dn" name="dn" maxlength="24" value="${esc(mem.display)}" /></label>
        ${penPicker(v.pen || mem.pen)}
        <button class="btn primary" type="submit" style="margin-top:1rem">Save name and pen</button>
      </form>
      <div class="divider">
        <p class="hand" style="font-size:1.5rem;font-weight:600;margin:0 0 .3rem">Shops</p>
        <p class="tiny">The five main shops stay put. Your own shops can be renamed or deleted, and their items go back on the main list.</p>
        ${stores.map(s => `<div class="shop-row">
          <span class="hand">${esc(s.name)}</span>
          ${s.custom ? `<button type="button" class="textlink" data-a="ren-store" data-sid="${s.id}">Rename</button>
            <button type="button" class="textlink" data-a="rm-store" data-sid="${s.id}" style="color:var(--accent)">Delete</button>` : ""}
        </div>`).join("")}
        <form data-f="add-shop" style="display:flex;gap:.4rem;margin-top:.6rem">
          <input class="inp" id="as-name" name="n" placeholder="Corner shop…" maxlength="32" />
          <button class="btn primary" type="submit" style="width:auto">Add</button>
        </form>
      </div>
      <button class="btn ghost" data-a="leave" style="margin-top:1.2rem;color:var(--accent)">Leave this gaff</button>
      ${steLogo("ste-mini")}`);
  }

  return {
    key: "gaff-" + code,
    fixed: true,
    // The typing box lives in the fixed frame below and is never redrawn
    shell: `<div data-r="top"></div><div data-r="trips"></div>
      <div class="paper sheet"><span class="tape l"></span><span class="tape r"></span>
        <div class="list" data-r="list"></div>
        <div data-r="note"></div>
        <div class="composer"><div data-r="storeline"></div>${composer}</div>
        <p class="hint">Tap an item to pick it, tap again to scratch it off. × deletes.</p>
      </div>
      <div data-r="modal"></div>`,
    order: ["top", "trips", "list", "note", "storeline", "modal"],
    regions: {
      top,
      trips: `<div class="trips">${tripsHTML}</div>`,
      list: listHTML,
      note,
      storeline: storeLine,
      modal: m,
    },
  };
}


/* ---------------- Pop-up boxes (replace the plain browser ones) ---------------- */
function dialog({ title, text = "", input = null, ok = "OK", cancel = null, danger = false }) {
  return new Promise(resolve => {
    const root = $("#dlg");
    const prevFocus = document.activeElement;
    root.innerHTML = `<div class="overlay" data-d="cancel"></div>
      <div class="modal" role="alertdialog" aria-modal="true" aria-label="${esc(title)}"><div class="paper">
        <h2 class="title">${esc(title)}</h2>
        ${text ? `<p class="muted">${esc(text)}</p>` : ""}
        <form id="dlg-f">
          ${input !== null ? `<input class="inp" id="dlg-in" maxlength="40" value="${esc(input)}" style="margin:.4rem 0 1rem" />` : ""}
          <div class="stack" style="margin-top:.8rem">
            <button class="btn primary" type="submit" ${danger ? `style="background:var(--accent)"` : ""}>${esc(ok)}</button>
            ${cancel ? `<button class="btn ghost" type="button" data-d="cancel">${esc(cancel)}</button>` : ""}
          </div>
        </form>
      </div></div>`;
    const done = (val) => { root.innerHTML = ""; try { prevFocus && prevFocus.focus({ preventScroll: true }); } catch (e) {} resolve(val); };
    root.querySelectorAll("[data-d=cancel]").forEach(b => b.onclick = () => done(input !== null ? null : false));
    $("#dlg-f").onsubmit = (e) => { e.preventDefault(); done(input !== null ? $("#dlg-in").value : true); };
    const f = $("#dlg-in") || root.querySelector("button[type=submit]");
    setTimeout(() => f && f.focus(), 30);
  });
}
const say = (title, text) => dialog({ title, text });
const ask = (title, text, ok, danger) => dialog({ title, text, ok, cancel: "Cancel", danger });
const askText = (title, value, ok) => dialog({ title, input: value, ok, cancel: "Cancel" });

function toast(msg, action = null, ms = 4500) {
  const box = document.createElement("div");
  box.className = "toast";
  box.innerHTML = `<span class="m">${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ""}`;
  $("#toasts").appendChild(box);
  const t = setTimeout(() => box.remove(), ms);
  if (action) box.querySelector("button").onclick = () => { clearTimeout(t); box.remove(); action.run(); };
  while ($("#toasts").children.length > 3) $("#toasts").firstChild.remove();
}

/* ---------------- Actions ---------------- */
function closeModal() { S.view.modal = null; S.view.err = ""; S.view.pen = null; S.view.busy = false; S.view.copied = false; render(); }

const A = {
  reload: () => location.reload(),
  close: closeModal,
  home: () => { S.view = { page: "home" }; render(); },
  open: (el) => openGaff(el.dataset.code),
  create: () => { S.view.modal = "create"; render(); },
  join: () => { S.view.modal = "join"; render(); },
  you: () => { S.view.modal = "you"; render(); },
  m: (el) => {
    S.view.modal = el.dataset.m;
    if (el.dataset.m === "trip") S.view.tripShop = null;
    render();
  },
  pen: (el) => { S.view.pen = el.dataset.pen; render(); },

  "accept-join": async () => {
    const code = S.view.code;
    try { await joinGaff(code); S.pendingJoin = null; openGaff(code); }
    catch (e) { console.warn(e); say("Couldn't join", "Check your signal and try again."); }
  },
  "skip-join": () => { S.pendingJoin = null; S.view = { page: "home" }; render(); },

  tap: (el) => {
    const code = S.view.code, id = el.dataset.id;
    const g = G(code);
    const it = g.items.find(i => i.id === id);
    if (!it) return;
    if (S.view.selected !== id) { S.view.selected = id; render(); return; }
    const mem = myMember(code) || { display: me().name, pen: me().pen };
    if (it.boughtAt) {
      write(B().updateItem(code, id, { boughtAt: null, boughtBy: null, boughtByName: null, boughtByColor: null }));
    } else {
      write(B().updateItem(code, id, { boughtAt: Date.now(), boughtBy: S.uid, boughtByName: mem.display, boughtByColor: mem.pen }));
      autoTrip(code, id);
    }
  },
  del: (el) => {
    const code = S.view.code, id = el.dataset.id;
    const it = G(code).items.find(i => i.id === id);
    if (!it) return;
    const copy = { ...it }; delete copy.id;
    if (S.view.selected === id) S.view.selected = null;
    write(B().deleteItem(code, id));
    toast(`Deleted “${it.text}”`, { label: "Undo", run: () => write(B().setItem(code, id, copy)) }, UNDO_FOR);
  },
  "pick-store": (el) => {
    const code = S.view.code, sid = el.dataset.sid || null;
    if (S.view.selected) write(B().updateItem(code, S.view.selected, { storeId: sid }));
    else S.view.addStore = sid;
    closeModal();
  },
  "clear-store": () => {
    if (S.view.selected) write(B().updateItem(S.view.code, S.view.selected, { storeId: null }));
    else S.view.addStore = null;
    render();
  },

  "invite-wa": () => {
    const d = G(S.view.code).doc;
    const text = `Join ${d.name} on What's 4 the Gaff, our house shopping list 🛒 ${inviteLink(S.view.code)}`;
    openWhatsApp(text);
  },
  "invite-share": async () => {
    const d = G(S.view.code).doc;
    try { await navigator.share({ title: "What's 4 the Gaff", text: `Join ${d.name} on What's 4 the Gaff, our house shopping list 🛒`, url: inviteLink(S.view.code) }); } catch (e) {}
  },
  "invite-copy": async () => {
    const link = inviteLink(S.view.code);
    try { await navigator.clipboard.writeText(link); S.view.copied = true; render(); }
    catch (e) { await dialog({ title: "Copy this link", input: link, ok: "Done" }); }
  },

  "trip-shop": (el) => { S.view.tripShop = el.dataset.sid; render(); },
  "trip-start": () => {
    const code = S.view.code, d = G(code).doc;
    const shop = (d.stores || []).find(s => s.id === S.view.tripShop);
    if (!shop) return;
    const waToo = !!$("#wa-too")?.checked;
    prefs.set("waToo", waToo);
    const mem = myMember(code) || { display: me().name, pen: me().pen };
    // WhatsApp has to open straight from the tap, or the phone blocks it
    if (waToo) {
      const text = `🔔 Last orders! I'm heading to ${shop.name}. Add anything you need to the ${d.name} list: ${runLink(code)}`;
      shareOrders(mem.display, shop.name, text);
    }
    write(B().setTrip(code, S.uid, { name: mem.display, pen: mem.pen, shopId: shop.id, shopName: shop.name, stage: "heading", at: Date.now() }));
    closeModal();
  },
  "trip-stage": (el) => setTripStage(S.view.code, el.dataset.stage),
  "trip-cancel": () => write(B().setTrip(S.view.code, S.uid, null)),

  "ren-store": async (el) => {
    const code = S.view.code, stores = G(code).doc.stores || [];
    const s = stores.find(x => x.id === el.dataset.sid);
    if (!s) return;
    const n = ((await askText("Rename shop", s.name, "Rename")) || "").trim();
    if (!n || n === s.name) return;
    if (stores.some(x => x.id !== s.id && x.name.toLowerCase() === n.toLowerCase())) { say("That shop's already on the list"); return; }
    write(B().updateGaff(code, { stores: stores.map(x => x.id === s.id ? { ...x, name: n } : x) }));
  },
  "rm-store": async (el) => {
    const code = S.view.code, g = G(code), stores = g.doc.stores || [];
    const s = stores.find(x => x.id === el.dataset.sid);
    if (!s) return;
    if (!(await ask(`Delete ${s.name}?`, "Its items go back on the main list.", "Delete shop", true))) return;
    g.items.filter(i => i.storeId === s.id).forEach(i => write(B().updateItem(code, i.id, { storeId: null })));
    write(B().updateGaff(code, { stores: stores.filter(x => x.id !== s.id) }));
  },
  leave: async () => {
    const code = S.view.code, name = G(code).doc.name;
    if (!(await ask(`Leave ${name}?`, "You'll stop seeing this list. You can rejoin with the invite link.", "Leave gaff", true))) return;
    const t = G(code)?.doc?.trips?.[S.uid];
    try {
      if (t) await withTimeout(B().setTrip(code, S.uid, null), 6000).catch(() => {});
      dropGaff(code);
      await withTimeout(B().removeMember(code, S.uid), 8000);
      await withTimeout(B().removeGaffFromProfile(S.uid, code), 8000);
    } catch (e) { console.warn(e); }
    S.view = { page: "home" }; render();
  },
};

// When the person who's out shopping starts scratching things off
function autoTrip(code, justBoughtId) {
  const t = G(code)?.doc?.trips?.[S.uid];
  if (!t || t.stage === "finished") return;
  const left = G(code).items.filter(i => i.id !== justBoughtId && !i.boughtAt && (!i.storeId || i.storeId === t.shopId));
  if (left.length === 0) setTripStage(code, "finished");
  else if (t.stage === "heading") setTripStage(code, "arrived");
}
function setTripStage(code, stage) {
  const t = G(code)?.doc?.trips?.[S.uid];
  if (!t || t.stage === stage) return;
  write(B().setTrip(code, S.uid, { ...t, stage, at: Date.now() }));
  if (stage === "finished") toast(`Nice one. The house can see you've finished at ${t.shopName} ✅`);
}

async function joinGaff(code) {
  const d = await withTimeout(B().getGaff(code), 12000, "offline");
  if (!d) throw new Error("No gaff with that code");
  const u = me();
  S.fixups.add(code);
  await withTimeout(B().setMember(code, S.uid, { display: u.name, pen: u.pen, joinedAt: Date.now() }), 12000, "offline");
  await withTimeout(B().addGaffToProfile(S.uid, code), 12000, "offline");
  return d;
}

const F = {
  welcome: async (form) => {
    const name = form.name.value.trim().replace(/\s+/g, " ");
    if (name.length < 2) { S.view.err = "Pop in a name (at least 2 letters)"; render(); return; }
    const pen = S.view.pen || "navy";
    const data = { name, pen, gaffs: [], createdAt: Date.now(), trialStartedAt: Date.now() };
    S.profile = { ...(S.profile || {}), ...data };
    write(B().saveProfile(S.uid, data));
    S.view = { page: "home" };
    render();
  },
  create: async (form) => {
    const name = form.name.value.trim().replace(/\s+/g, " ");
    if (!name) { S.view.err = "Give the house a name"; render(); return; }
    S.view.busy = true; S.view.err = ""; render();
    try {
      let code = makeCode();
      for (let i = 0; i < 5 && await withTimeout(B().getGaff(code), 12000, "offline"); i++) code = makeCode();
      const u = me();
      const gaff = { name, code, createdBy: S.uid, createdAt: Date.now(), stores: PRESETS.map(p => ({ ...p, custom: false })), trips: {} };
      await withTimeout(B().createGaff(code, gaff, S.uid, { display: u.name, pen: u.pen, joinedAt: Date.now() }), 12000, "offline");
      await withTimeout(B().addGaffToProfile(S.uid, code), 12000, "offline");
      S.profile.gaffs = [...new Set([...(S.profile.gaffs || []), code])];
      syncSubs();
      openGaff(code);
      S.view.modal = "invite";
      render();
    } catch (e) {
      console.warn(e);
      S.view.busy = false; S.view.err = "Couldn't create it. Creating a gaff needs signal, so check your connection and try again."; render();
    }
  },
  join: async (form) => {
    const code = cleanCode(form.code.value);
    if (code.length < 6) { S.view.err = "Codes are 6 letters and numbers"; render(); return; }
    if ((me().gaffs || []).includes(code)) { openGaff(code); return; }
    S.view.busy = true; S.view.err = ""; render();
    try {
      await joinGaff(code);
      S.profile.gaffs = [...new Set([...(S.profile.gaffs || []), code])];
      syncSubs();
      openGaff(code);
    } catch (e) {
      console.warn(e);
      S.view.busy = false;
      S.view.err = e.message === "No gaff with that code" ? "No gaff with that code. Check it and try again." : "Couldn't join. Joining needs signal, so check your connection.";
      render();
    }
  },
  you: (form) => {
    const name = form.name.value.trim().replace(/\s+/g, " ");
    if (name.length < 2) return;
    const pen = S.view.pen || me().pen;
    S.profile = { ...S.profile, name, pen };
    write(B().saveProfile(S.uid, { name, pen }));
    closeModal();
  },
  add: (form) => {
    const code = S.view.code;
    const input = $("#draft");
    const text = input.value.trim().replace(/\s+/g, " ");
    if (!text) return;
    const noteBox = $("#note-new");
    const note = S.view.selected ? (S.view.addNote || "") : ((noteBox && noteBox.value) || S.view.addNote || "").trim();
    const id = newId();
    write(B().setItem(code, id, {
      text, note, storeId: S.view.addStore || null, createdBy: S.uid, createdAt: Date.now(),
      boughtAt: null, boughtBy: null, boughtByName: null, boughtByColor: null,
    }));
    input.value = "";
    if (noteBox) noteBox.value = "";
    S.view.addNote = ""; S.view.addStore = null; S.view.selected = null;
    render();
    requestAnimationFrame(() => {
      const l = $(".list"); if (l) l.scrollTop = l.scrollHeight;
      const dr = $("#draft"); if (dr) dr.focus({ preventScroll: true });
    });
  },
  "new-shop": (form) => {
    const code = S.view.code, stores = G(code).doc.stores || [];
    const name = form.n.value.trim();
    if (!name) return;
    if (stores.some(s => s.name.toLowerCase() === name.toLowerCase())) { say("That shop's already on the list"); return; }
    const s = { id: newId(), name, custom: true };
    write(B().updateGaff(code, { stores: [...stores, s] }));
    if (S.view.selected) write(B().updateItem(code, S.view.selected, { storeId: s.id }));
    else S.view.addStore = s.id;
    closeModal();
  },
  "add-shop": (form) => {
    const code = S.view.code, stores = G(code).doc.stores || [];
    const name = form.n.value.trim();
    if (!name) return;
    if (stores.some(s => s.name.toLowerCase() === name.toLowerCase())) { say("That shop's already on the list"); return; }
    write(B().updateGaff(code, { stores: [...stores, { id: newId(), name, custom: true }] }));
    form.n.value = "";
  },
  me: (form) => {
    const code = S.view.code;
    let dn = form.dn.value.trim().replace(/\s+/g, " ");
    if (dn.length < 2) return;
    const others = Object.entries(G(code).members).filter(([id]) => id !== S.uid).map(([, m]) => m);
    if (others.some(o => (o.display || "").toLowerCase() === dn.toLowerCase())) dn = uniqueName(others, dn);
    const pen = S.view.pen || myMember(code)?.pen || me().pen;
    write(B().setMember(code, S.uid, { display: dn, pen }));
    const t = G(code).doc?.trips?.[S.uid];
    if (t) write(B().setTrip(code, S.uid, { ...t, name: dn, pen }));
    closeModal();
  },
};

// One listener for every tap and form in the app
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || !$("#app").contains(el)) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-f]");
  if (!f || !$("#app").contains(f)) return;
  e.preventDefault();
  const fn = F[f.dataset.f];
  if (fn) fn(f, e);
});
document.addEventListener("input", (e) => {
  if (e.target.dataset.i !== "note") return;
  const val = e.target.value.slice(0, 280);
  const code = S.view.code, sel = S.view.selected;
  if (!sel) { S.view.addNote = val; return; }
  clearTimeout(S.noteTimer);
  S.noteTimer = setTimeout(() => write(B().updateItem(code, sel, { note: val })), 500);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.view.modal && !$("#dlg").innerHTML) closeModal();
});
// Keep "x mins ago" fresh and tidy up old finished trips
setInterval(() => { if (S.view.page === "gaff" || S.view.page === "home") { for (const c of Object.keys(S.gaffs)) tidyMyTrip(c); render(); } }, 60000);

/* ---------------- Start up ---------------- */
async function boot() {
  render();
  const q = new URLSearchParams(location.search);
  // The real app only connects on its own web address; anywhere else (like Claude's preview) runs as a preview copy
  const liveHost = /(^|\.)github\.io$|(^|\.)spectrumtechengine\.com$/i.test(location.hostname) || q.has("live");
  const previewHost = !liveHost;
  S.live = liveHost;
  if (!q.has("demo") && liveHost && window.firebase) {
    try {
      S.backend = makeFirebaseBackend();
      S.uid = await withTimeout(S.backend.start(), 12000, "timeout");
    } catch (e) {
      console.warn("Firebase didn't start", e);
      S.uid = null;
      if (!previewHost) {
        S.view = { page: "error", msg: navigator.onLine
          ? "The app couldn't reach the house list. Close it, wait a moment and try again."
          : "The first time you open the app it needs signal. Connect to Wi-Fi or data and try again." };
        render();
        return;
      }
    }
  } else if (!q.has("demo") && !previewHost) {
    S.view = { page: "error", msg: "The app couldn't load. Check your signal and try again." };
    render();
    return;
  }
  if (!S.uid) { S.backend = makeLocalBackend(); S.uid = await S.backend.start(); }
  B().watchProfile(S.uid, (p) => {
    // Keep a name typed on this phone even if the server copy hasn't caught up yet
    if (p || S.profile === undefined) S.profile = p ? { ...p } : null;
    syncSubs();
    render();
  }, (e) => { console.warn("profile", e); if (S.profile === undefined) { S.profile = null; render(); } });
}
boot();
</script>
